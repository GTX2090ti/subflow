<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>SubFlow · 手机管理</title>
<link rel="stylesheet" href="./mobile.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M7 21h10M12 17.5V21"/><path d="M9.5 9.2v4.1l3.6-2.05z"/></g></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/></g></symbol>
  <symbol id="i-jobs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="4.2" cy="6" r="1.3"/><circle cx="4.2" cy="12" r="1.3"/><circle cx="4.2" cy="18" r="1.3"/></g></symbol>
  <symbol id="i-miss" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M6 9h7M6 12.5h5"/><path d="M15.5 12.2h1.8M15.5 15.2h1.8"/><path d="M14 6.5h6"/></g></symbol>
  <symbol id="i-logs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="4" width="18.8" height="16" rx="2.4"/><path d="M6.6 9.2l2.4 2.2-2.4 2.2M11.6 14h6"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.09A1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4 20 20"/></g></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M21 3.5V9h-5.4"/></g></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/><circle cx="12" cy="12" r="3.2"/></g></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.2V4.5h7.7l9.3 9.3-7.7 7.7-9.3-9.3z"/><circle cx="8" cy="8" r="1.4"/></g></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 3.5V9h5.4"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.8"/><path d="M10 8.8l5 3.2-5 3.2z"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6.5" rx="2"/><rect x="3" y="13.5" width="18" height="6.5" rx="2"/><path d="M7 7.2h.01M7 16.8h.01M11 7.2h5M11 16.8h5"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 13h9.4l.8-13"/><path d="M10 11v5M14 11v5"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></g></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 16 12l-6.5 7"/></g></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></g></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.1 2"/></g></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.8a14 14 0 0 1 18 0M6.2 12.6a9.4 9.4 0 0 1 11.6 0M9.4 16.4a4.6 4.6 0 0 1 5.2 0"/><circle cx="12" cy="19.6" r="1.1" fill="currentColor" stroke="none"/></g></symbol>
</svg>

<div class="app">
  <div id="ptr"><span class="spin"></span><span id="ptr-text">下拉刷新</span></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
      <div class="brand-text">
        <b>SubFlow</b>
        <span id="conn-state">正在连接…</span>
      </div>
      <i id="conn-dot" class="dot"></i>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="连接设置">
      <svg><use href="#i-gear"/></svg>
    </button>
  </header>

  <main id="views">
    <!-- ============================ 概览 ============================ -->
    <section class="view on" data-view="home">
      <div class="card hero">
        <div class="hero-top">
          <div>
            <div class="eyebrow">扫描状态</div>
            <div class="hero-phase" id="home-phase">空闲</div>
          </div>
          <span class="pill" id="home-version">-</span>
        </div>
        <div class="progress"><i id="home-progress"></i></div>
        <div class="hero-meta">
          <span id="home-meta">-</span>
          <span id="home-queue">-</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>待处理</span><b id="st-pending">-</b></div>
        <div class="stat"><span>进行中</span><b id="st-running">-</b></div>
        <div class="stat err"><span>失败</span><b id="st-failed">-</b></div>
        <div class="stat ok"><span>今日成功</span><b id="st-today">-</b></div>
      </div>

      <div class="sec-head"><h2>快捷操作</h2><span class="muted" id="home-tip"></span></div>
      <div class="quick">
        <button class="qbtn" id="btn-scan"><svg><use href="#i-scan"/></svg><span>开始扫描</span></button>
        <button class="qbtn" id="btn-cat"><svg><use href="#i-tag"/></svg><span>按分类批量</span></button>
        <button class="qbtn" id="btn-retry"><svg><use href="#i-retry"/></svg><span>重试失败</span></button>
        <button class="qbtn" id="btn-run"><svg><use href="#i-play"/></svg><span>执行待处理</span></button>
        <button class="qbtn" id="btn-submit"><svg><use href="#i-plus"/></svg><span>手动提交</span></button>
      </div>

      <div class="sec-head"><h2>最近任务</h2><button class="link" data-goto="jobs">全部</button></div>
      <div class="list" id="home-jobs"><div class="empty">加载中…</div></div>
    </section>

    <!-- ============================ 任务 ============================ -->
    <section class="view" data-view="jobs">
      <div class="sticky-tools">
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input id="job-keyword" type="search" placeholder="搜索种子 / 字幕 / 站点" autocomplete="off">
        </label>
        <button class="icon-btn" id="job-refresh" aria-label="刷新"><svg><use href="#i-refresh"/></svg></button>
      </div>
      <div class="chips scroll" id="job-chips"></div>
      <div class="list" id="job-list"><div class="empty">加载中…</div></div>
      <button class="load-more" id="job-more" hidden>加载更多</button>
      <div class="selectbar" id="job-bar" hidden>
        <label class="check"><input type="checkbox" id="job-all"><span>全选</span></label>
        <span class="muted" id="job-picked">已选 0</span>
        <button class="btn sm" id="job-cancel">完成</button>
        <button class="btn primary sm" id="job-retry">批量重试</button>
      </div>
    </section>

    <!-- ============================ 缺字幕 ============================ -->
    <section class="view" data-view="missing">
      <div class="card compact">
        <div class="form-row">
          <label class="field">
            <span>时间窗口</span>
            <select id="miss-days">
              <option value="7">最近 7 天</option>
              <option value="30" selected>最近 30 天</option>
              <option value="90">最近 90 天</option>
              <option value="0">不限时间</option>
            </select>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="miss-matched">
            <span>只看可补</span>
          </label>
        </div>
        <div class="form-row">
          <input id="miss-keyword" type="search" placeholder="关键词（可选）" autocomplete="off">
          <button class="btn primary" id="miss-run">检查</button>
        </div>
        <div class="form-row">
          <button class="btn" id="miss-probe-run" style="flex:1">复查站点</button>
          <label class="switch-row"><input type="checkbox" id="miss-new-only"><span>只看新上</span></label>
        </div>
        <p class="hint" id="miss-stat">以本地视频文件为准，检查视频旁是否已有字幕。</p>
        <p class="hint" id="miss-probe-stat" hidden></p>
      </div>
      <div class="sec-head"><h2>缺失条目</h2><span class="muted" id="miss-count"></span></div>
      <div class="list" id="miss-list"><div class="empty">点「检查」生成清单</div></div>
      <div class="selectbar" id="miss-bar" hidden>
        <label class="check"><input type="checkbox" id="miss-all"><span>全选可补</span></label>
        <span class="muted" id="miss-picked">已选 0</span>
        <button class="btn primary sm" id="miss-repair">补字幕</button>
      </div>
    </section>

    <!-- ============================ 日志 ============================ -->
    <section class="view" data-view="logs">
      <div class="sticky-tools">
        <div class="chips scroll" id="log-levels"></div>
        <label class="switch-row"><input type="checkbox" id="log-auto" checked><span>自动</span></label>
        <button class="icon-btn" id="log-refresh" aria-label="刷新"><svg><use href="#i-refresh"/></svg></button>
      </div>
      <div class="form-row logs-filter">
        <input id="log-keyword" type="search" placeholder="过滤日志内容" autocomplete="off">
      </div>
      <div class="logbox" id="log-list"><div class="empty">加载中…</div></div>
    </section>

    <!-- ============================ 更多 ============================ -->
    <section class="view" data-view="more">
      <div class="card more-head">
        <div class="more-head-main">
          <div class="eyebrow">当前服务器</div>
          <div class="hero-phase" id="more-base">-</div>
          <p class="hint" id="more-summary">-</p>
        </div>
        <span class="pill" id="more-version">-</span>
      </div>
      <div class="menu">
        <button class="menu-row" data-goto="stats">
          <span class="menu-ico"><svg><use href="#i-stats"/></svg></span>
          <span class="menu-txt"><b>统计报表</b><i>每日走势、站点与失败原因</i></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <button class="menu-row" data-goto="zone">
          <span class="menu-ico"><svg><use href="#i-miss"/></svg></span>
          <span class="menu-txt"><b>字幕区</b><i>站点级字幕汇总，按条下载</i></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <button class="menu-row" data-goto="sites">
          <span class="menu-ico"><svg><use href="#i-server"/></svg></span>
          <span class="menu-txt"><b>站点与 Cookie</b><i>登录态健康度与 CookieCloud</i></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <button class="menu-row" data-goto="schedule">
          <span class="menu-ico"><svg><use href="#i-clock"/></svg></span>
          <span class="menu-txt"><b>定时扫描</b><i>周期、窗口与下次执行</i></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <button class="menu-row" id="more-settings">
          <span class="menu-ico"><svg><use href="#i-gear"/></svg></span>
          <span class="menu-txt"><b>连接设置</b><i>服务器地址与访问控制</i></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
      </div>
      <p class="hint" id="more-channel">-</p>
    </section>

    <!-- ============================ 统计 ============================ -->
    <section class="view" data-view="stats">
      <div class="subhead">
        <button class="icon-btn" data-back aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <h2>统计报表</h2>
        <span class="muted" id="stats-at"></span>
      </div>
      <div class="chips" id="stats-range">
        <button class="chip" data-days="7">7 天</button>
        <button class="chip on" data-days="30">30 天</button>
        <button class="chip" data-days="90">90 天</button>
        <button class="chip" data-days="365">一年</button>
      </div>
      <div id="stats-body"><div class="empty">加载中…</div></div>
    </section>

    <!-- ============================ 字幕区 ============================ -->
    <section class="view" data-view="zone">
      <div class="subhead">
        <button class="icon-btn" data-back aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <h2>字幕区</h2>
      </div>
      <div class="card compact">
        <div class="form-row">
          <label class="field"><span>站点</span><select id="zone-site"></select></label>
          <label class="field" style="flex:0 0 92px"><span>页数</span>
            <select id="zone-pages">
              <option value="1">1 页</option>
              <option value="3">3 页</option>
              <option value="0">全部</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <input id="zone-keyword" type="search" placeholder="关键词（可选）" autocomplete="off">
          <button class="btn primary" id="zone-load">读取</button>
        </div>
        <p class="hint" id="zone-stat">从站点字幕区读取最新的字幕条目。</p>
      </div>
      <div class="chips" id="zone-filters">
        <button class="chip on" data-zf="all">全部</button>
        <button class="chip" data-zf="matched">仅本地命中</button>
      </div>
      <div class="list" id="zone-list"><div class="empty">点「读取」拉取字幕区</div></div>
      <div class="selectbar" id="zone-bar" hidden>
        <label class="check"><input type="checkbox" id="zone-all"><span>全选</span></label>
        <span class="muted" id="zone-picked">已选 0</span>
        <button class="btn primary sm" id="zone-submit">下载字幕</button>
      </div>
    </section>

    <!-- ============================ 站点与 Cookie ============================ -->
    <section class="view" data-view="sites">
      <div class="subhead">
        <button class="icon-btn" data-back aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <h2>站点与 Cookie</h2>
        <button class="icon-btn" id="sites-refresh" aria-label="刷新"><svg><use href="#i-refresh"/></svg></button>
      </div>
      <div class="card" id="cc-box"><div class="empty">加载中…</div></div>
      <div class="sec-head"><h2>站点状态</h2></div>
      <div class="list" id="site-list"><div class="empty">加载中…</div></div>
    </section>

    <!-- ============================ 定时扫描 ============================ -->
    <section class="view" data-view="schedule">
      <div class="subhead">
        <button class="icon-btn" data-back aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <h2>定时扫描</h2>
      </div>
      <div id="sched-body"><div class="empty">加载中…</div></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-view="home"><svg><use href="#i-home"/></svg><span>概览</span></button>
    <button class="tab" data-view="jobs"><svg><use href="#i-jobs"/></svg><span>任务</span><i class="tab-badge" id="tab-badge-jobs" hidden>0</i></button>
    <button class="tab" data-view="missing"><svg><use href="#i-miss"/></svg><span>缺字幕</span></button>
    <button class="tab" data-view="logs"><svg><use href="#i-logs"/></svg><span>日志</span></button>
    <button class="tab" data-view="more"><svg><use href="#i-more"/></svg><span>更多</span></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="./mobile.js"></script>
</body>
</html>
