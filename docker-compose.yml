# SubFlow —— PT 视频字幕下载 Web UI（内网部署）
#
# 适用场景：qBittorrent / CookieCloud / SubFlow 都跑在同一台内网主机或同一网段。
#
# 关键约定：
#   1. 使用 host 网络模式。部分 NAS（如飞牛 FnOS）只放行 172.16/12 网段的容器
#      访问宿主机服务，Docker 自动分配的 192.168.x/20 bridge 子网会被拦截，
#      表现为连接 qBittorrent(8080) / CookieCloud(8188) 一律超时。
#      host 模式下容器复用宿主机网络栈，qB 填 http://127.0.0.1:8080 即可。
#      若 qB 在另一台内网机器上，改成它的内网 IP（如 http://192.168.1.10:8080）。
#   2. 必须把 qB 下载根目录以「同路径」挂进容器，否则字幕写不进视频目录。
#      例：宿主机 /path/to/downloads -> 容器 /path/to/downloads，
#      配置里的 qbittorrent.save_map 写 "/downloads=/path/to/downloads"。
#   3. config.json 与 SQLite 数据库都放在 data 目录，一个卷即可备份。

services:
  subflow:
    image: ${SUBFLOW_IMAGE:-subflow:latest}
    build: .
    container_name: subflow
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      SUBFLOW_CONFIG_FILE: /app/data/config.json
    volumes:
      # 配置 + 数据库（任务/历史/日志）持久化
      - ./data:/app/data
      # 字幕落盘根目录：宿主机与容器内必须同路径（DOWNLOAD_DIR 可写在 .env）
      - ${DOWNLOAD_DIR:-/path/to/downloads}:${DOWNLOAD_DIR:-/path/to/downloads}
      # 可选：从 qBittorrent.conf 读取 WebUI APIKey（改成实际路径后取消注释）
      # - /path/to/qBittorrent.conf:/qb/qBittorrent.conf:ro
      # 可选：导入旧版 qbit_sub_sync_state.json 历史（改成实际路径后取消注释）
      # - /path/to/legacy:/legacy:ro
